# Release packages are built here instead of on a developer machine.
# A pushed tag vX.Y.Z builds both platforms and creates a DRAFT release with
# exactly the five runtime files; publishing the draft stays a manual step
# after the OTA check of the previous client (docs/release.md).
# Running the workflow by hand builds the same files as artifacts only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux AppImage and tar.gz
    # Ubuntu 24.04 is the glibc 2.39 baseline of the Linux packages.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev \
            libfontconfig1-dev python3 binutils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-release
      - name: Build and package
        env:
          CARGO_TARGET_DIR: target
          VK_FAST_OUTPUT: ${{ github.workspace }}/dist
        run: ./scripts/build-linux.sh
      - name: Check that the AppImage starts
        run: |
          ls -l dist
          ./dist/VK-Fast-*-linux-x86_64.AppImage --appimage-extract-and-run --help
          # The VK client's TLS verifies a real certificate.
          ./dist/VK-Fast-*-linux-x86_64.AppImage --appimage-extract-and-run --check-tls
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/VK-Fast-*-linux-x86_64.AppImage
            dist/VK-Fast-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows portable zip and installer
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # BoringSSL (Chrome's TLS for VK, src/chrome_http.rs) assembles its
      # Windows code with NASM.
      - name: Install NASM
        run: |
          nasm_zip="$RUNNER_TEMP/nasm-2.16.03-win64.zip"
          curl -fsSL --retry 3 "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip" -o "$nasm_zip"
          echo "3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6  $nasm_zip" | sha256sum -c -
          unzip -q -o "$nasm_zip" -d "$RUNNER_TEMP/nasm"
          nasm_dir="$(cygpath -w "$RUNNER_TEMP/nasm/nasm-2.16.03")"
          nasm_win="$nasm_dir\\nasm.exe"
          "$RUNNER_TEMP/nasm/nasm-2.16.03/nasm.exe" -v
          echo "$nasm_dir" >> "$GITHUB_PATH"
          echo "ASM_NASM=$nasm_win" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - name: Build and package
        env:
          VK_FAST_PYTHON: python
        run: ./scripts/build-windows.sh --installer --output dist
      - name: Check the portable zip and that the program starts
        run: |
          ls -l dist
          python - <<'EOF'
          import glob, zipfile
          [archive] = glob.glob('dist/VK-Fast-*-windows-x86_64.zip')
          names = zipfile.ZipFile(archive).namelist()
          assert names == ['vk-fast.exe'], names
          EOF
          mkdir -p "$RUNNER_TEMP/portable"
          unzip -o dist/VK-Fast-*-windows-x86_64.zip -d "$RUNNER_TEMP/portable"
          "$RUNNER_TEMP/portable/vk-fast.exe" --print-data-paths
          # The VK client's TLS verifies a real certificate (0.9.2 could not
          # on Windows: BoringSSL found no root certificates there).
          "$RUNNER_TEMP/portable/vk-fast.exe" --check-tls
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/VK-Fast-*-windows-x86_64.zip
            dist/VK-Fast-*-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: Linux Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils appstream desktop-file-utils python3-venv
          # bubblewrap needs unprivileged user namespaces, which Ubuntu 24.04
          # restricts by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check desktop entry and metainfo
        run: |
          desktop-file-validate flatpak/io.github.eml3ss.VkFast.desktop
          appstreamcli validate --no-net --explain flatpak/io.github.eml3ss.VkFast.metainfo.xml
          # Software centres show the version from the metainfo's releases.
          version="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")"
          grep -q "<release version=\"$version\"" flatpak/io.github.eml3ss.VkFast.metainfo.xml \
            || { echo "metainfo has no <release> for $version"; exit 1; }
      # The build itself is offline: every crate comes from Cargo.lock.
      - name: Generate cargo sources
        run: |
          generator="$RUNNER_TEMP/flatpak-cargo-generator.py"
          curl -fsSL --retry 3 -o "$generator" \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          echo "0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380  $generator" | sha256sum -c -
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q aiohttp==3.12.15 tomlkit==0.13.3 PyYAML==6.0.2
          "$RUNNER_TEMP/venv/bin/python" -I "$generator" Cargo.lock -o flatpak/cargo-sources.json
      - name: Build the bundle
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")"
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo="$RUNNER_TEMP/repo" --force-clean "$RUNNER_TEMP/build" \
            flatpak/io.github.eml3ss.VkFast.yml
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/repo" "dist/VK-Fast-$version-linux-x86_64.flatpak" io.github.eml3ss.VkFast
      - name: Check that the Flatpak starts
        run: |
          ls -l dist
          flatpak install --user -y --noninteractive dist/VK-Fast-*-linux-x86_64.flatpak
          flatpak run io.github.eml3ss.VkFast --help
          # The VK client's TLS verifies a real certificate inside the sandbox.
          flatpak run io.github.eml3ss.VkFast --check-tls
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/VK-Fast-*-linux-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check version, files and notes
        id: check
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match Cargo.toml version {version}')
          expected = {
              f'VK-Fast-{version}-linux-x86_64.AppImage',
              f'VK-Fast-{version}-linux-x86_64.tar.gz',
              f'VK-Fast-{version}-linux-x86_64.flatpak',
              f'VK-Fast-{version}-windows-x86_64.zip',
              f'VK-Fast-{version}-windows-x86_64-setup.exe',
          }
          found = {path.name for path in pathlib.Path('dist').iterdir()}
          if found != expected:
              raise SystemExit(f'Release files differ: {sorted(found)}')
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(rf'^## {re.escape(version)}\n(.*?)(?=^## |\Z)', changelog, re.S | re.M)
          if not match or not match.group(1).strip():
              raise SystemExit(f'CHANGELOG.md has no section for {version}')
          pathlib.Path('notes.md').write_text(match.group(1).strip() + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          EOF
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "VK Fast $VERSION" --notes-file notes.md dist/*
