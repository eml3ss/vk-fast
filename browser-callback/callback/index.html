<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <!-- frame-ancestors requires an HTTP header, not a meta element.
         callback.js also refuses to hand off from inside a frame. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests">
    <title>VK Fast</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./callback.js"></script>
  </head>
  <body>
    <main class="card" aria-labelledby="heading">
      <div class="brand" aria-hidden="true"><span>VK</span> FAST</div>
      <h1 id="heading">Возвращаемся в VK Fast</h1>
      <p id="message">Передаём ответ VK в приложение.</p>
      <button id="open-app" type="button" disabled>Открыть VK Fast</button>
      <p id="status" class="muted" role="status" aria-live="polite">Если приложение не открылось, нажмите кнопку.</p>
      <p id="footnote" class="footnote">Завершение входа проверит приложение VK Fast.</p>
      <noscript><p class="notice">Для возврата в VK Fast включите JavaScript. / Enable JavaScript to return to VK Fast.</p></noscript>
    </main>
  </body>
</html>
